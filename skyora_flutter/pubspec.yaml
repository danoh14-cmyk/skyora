name: skyora
version: 1.0.0+1
description: SKYORA premium Korean weather client
publish_to: none
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  intl: ^0.19.0
  flutter_localizations:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/data/regions.json
    - assets/icon/app_icon.png
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: '#0B1640'
  adaptive_icon_foreground: assets/icon/adaptive_foreground.png
