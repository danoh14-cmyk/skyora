
name: SKYORA APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: skyora_flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify SKYORA API URL
        env:
          SKYORA_PROXY_URL: ${{ vars.SKYORA_PROXY_URL }}
        run: |
          if [ -z "$SKYORA_PROXY_URL" ]; then
            echo "::error::SKYORA_PROXY_URL is empty."
            exit 1
          fi
          case "$SKYORA_PROXY_URL" in
            https://*/forecast)
              echo "SKYORA API URL configured."
              ;;
            *)
              echo "::error::Invalid SKYORA_PROXY_URL."
              exit 1
              ;;
          esac

      - name: Create Android project
        run: flutter create . --platforms=android

      - name: Install dependencies
        run: flutter pub get

      - name: Install icon generator
        run: flutter pub add --dev flutter_launcher_icons:^0.14.3

      - name: Generate app icon
        run: dart run flutter_launcher_icons -f ../flutter_launcher_icons.yaml

      - name: Build APK
        env:
          SKYORA_PROXY_URL: ${{ vars.SKYORA_PROXY_URL }}
        run: |
          flutter build apk --debug \
            --dart-define="SKYORA_PROXY_URL=$SKYORA_PROXY_URL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SKYORA-APK
          path: skyora_flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
